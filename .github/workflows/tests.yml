# SPDX-License-Identifier: Apache-2.0
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relocation:
    name: Relocation unit tests (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make test-relocation test-jbroot
      - run: make test-relocation test-jbroot BUILD=build/sanitized SANITIZE=1

  linux-arm64:
    name: Linux arm64 (${{ matrix.name }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: clang, cc: clang, sanitize: "0" }
          - { name: gcc, cc: gcc, sanitize: "0" }
          - { name: sanitizers, cc: clang, sanitize: "1" }
    steps:
      - uses: actions/checkout@v7
      - name: Run all tests
        env:
          CC: ${{ matrix.cc }}
          SANITIZE: ${{ matrix.sanitize }}
        run: make test CC="$CC" SANITIZE="$SANITIZE"

  macos:
    name: macOS arm64 (${{ matrix.image }})
    # The free arm64 macOS runners for public repositories have been at
    # capacity for days and drop queued jobs, so this job runs only when
    # started by hand. The Darwin backend is built by the iOS package job
    # below and tested on jailbroken iPhones with that package.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v7
      # dpkg-divert, for the tests of the tweak loader switch.
      - run: brew install dpkg
      - run: make test

  ios-package:
    name: iOS device test package
    # Builds the tests for running on a jailbroken iPhone. The Intel image
    # has the same iOS SDK and has had free runners more often.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: brew install ldid dpkg make
      - name: Install Theos
        run: |
          git clone --quiet --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/theos/theos.git "$RUNNER_TEMP/theos"
          echo "THEOS=$RUNNER_TEMP/theos" >> "$GITHUB_ENV"
      - name: Build the sample tweak with Theos
        timeout-minutes: 10
        run: make build/ios/BurrowSampleTweak.dylib GNUMAKE="gmake messages=yes" < /dev/null
      - name: Run the loader and Safe Mode tests on macOS
        timeout-minutes: 10
        run: make test-loader test-safemode < /dev/null
      - name: Build and package
        timeout-minutes: 10
        env:
          VERSION: 0.0.0~dev.${{ github.run_number }}
        run: |
          make ios-tests-package PACKAGE_VERSION="$VERSION" < /dev/null
          make burrow-package PACKAGE_VERSION="$VERSION" < /dev/null
      - name: Inspect the package
        run: |
          for deb in build/packages/*.deb; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
          done
          # The Burrow package carries the chip check as its preinst.
          for deb in build/packages/com.nexusjb.burrow_*.deb; do
            dpkg-deb --ctrl-tarfile "$deb" | tar -tf - | grep -Eq '^(\./)?preinst$'
          done
          # RootHide's package: files in the hidden root, which its tools
          # and launchctl see as /, so nothing under /var/jb.
          roothide=$(ls build/packages/com.nexusjb.burrow_*_iphoneos-arm64e.deb)
          if dpkg-deb --contents "$roothide" | grep -q '/var/jb'; then
            echo "The RootHide package has files under /var/jb" >&2
            exit 1
          fi
          mkdir -p build/roothide-package
          dpkg-deb -R "$roothide" build/roothide-package
          for script in preinst postinst prerm postrm; do
            head -n 1 "build/roothide-package/DEBIAN/$script" | grep -qx '#!/bin/sh'
          done
          if grep -rq '/var/jb' build/roothide-package/DEBIAN build/roothide-package/Library; then
            echo "The RootHide package's scripts name /var/jb" >&2
            exit 1
          fi
          grep -q '<string>/usr/libexec/burrow/burrowd</string>' \
            build/roothide-package/Library/LaunchDaemons/com.nexusjb.burrowd.plist
          lipo -info build/ios-universal-roothide/*
          sh tests/preinst_tests.sh
          ldid -e build/ios/arm64e/hook-tests
          # iOS 18 keeps the crash reports and /tmp from programs without
          # these entitlements.
          for binary in build/ios/arm64e/burrowd build/ios/arm64e/burrowctl \
              build/ios-roothide/arm64e/burrowd build/ios-roothide/arm64e/burrowctl \
              build/ios/arm64e/loader/safemode-tests; do
            ldid -e "$binary" | grep -q com.apple.private.security.storage.DiagnosticReports
          done
          for binary in build/ios/arm64e/loader/loader-tests build/ios/arm64e/loader/safemode-tests; do
            ldid -e "$binary" | grep -q com.apple.private.security.storage.tmp
          done
          lipo -info build/ios/arm64/hook-tests build/ios/arm64e/hook-tests build/ios/BurrowSampleTweak.dylib
          otool -L build/ios/BurrowSampleTweak.dylib
          otool -l build/ios/BurrowSampleTweak.dylib | grep -A2 LC_RPATH
          nm -gU build/ios/arm64e/frameworks/CydiaSubstrate.framework/CydiaSubstrate
          lipo -info build/ios-universal/*
      - uses: actions/upload-artifact@v4
        with:
          name: burrow-${{ github.run_number }}
          path: build/packages/*.deb
          if-no-files-found: error

  publish-dev:
    name: Publish the development build
    # A run started by hand also publishes its packages as the dev
    # prerelease, which can be downloaded without signing in to GitHub.
    if: github.event_name == 'workflow_dispatch'
    needs: ios-package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: burrow-${{ github.run_number }}
          path: dist

      - name: Replace the development prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REF_NAME: ${{ github.ref_name }}
          VERSION: 0.0.0~dev.${{ github.run_number }}
        run: |
          cd dist
          sha256sum *.deb > SHA256SUMS
          cat SHA256SUMS
          notes="A development build of $REF_NAME ($SHA), for testing on a device. It is not a release.

          com.nexusjb.burrow is Burrow; com.nexusjb.burrow-tests holds the tests that run on a jailbroken iPhone."
          gh release delete dev --repo "$REPO" --yes --cleanup-tag || true
          gh release create dev --repo "$REPO" --prerelease --latest=false --target "$SHA" \
            --title "Development build $VERSION" --notes "$notes" ./*.deb SHA256SUMS
