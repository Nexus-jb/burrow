# SPDX-License-Identifier: Apache-2.0
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  relocation:
    name: Relocation unit tests (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make test-relocation
      - run: make test-relocation BUILD=build/sanitized SANITIZE=1

  linux-arm64:
    name: Linux arm64 (${{ matrix.name }})
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: clang, cc: clang, sanitize: "0" }
          - { name: gcc, cc: gcc, sanitize: "0" }
          - { name: sanitizers, cc: clang, sanitize: "1" }
    steps:
      - uses: actions/checkout@v7
      - name: Run all tests
        env:
          CC: ${{ matrix.cc }}
          SANITIZE: ${{ matrix.sanitize }}
        run: make test CC="$CC" SANITIZE="$SANITIZE"

  macos:
    name: macOS arm64 (${{ matrix.image }})
    # The free arm64 macOS runners for public repositories are often at
    # capacity, so the tests run on two images and any one of them is
    # enough to check the Darwin backend.
    runs-on: ${{ matrix.image }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        image: [macos-15, macos-26]
    steps:
      - uses: actions/checkout@v7
      - run: make test

  ios-package:
    name: iOS device test package
    # Builds the tests for running on a jailbroken iPhone. The Intel image
    # has the same iOS SDK and has had free runners more often.
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: brew install ldid dpkg
      - name: Build and package
        env:
          VERSION: 0.0.0~dev.${{ github.run_number }}
        run: make ios-tests-package PACKAGE_VERSION="$VERSION"
      - name: Inspect the package
        run: |
          for deb in build/packages/*.deb; do
            dpkg-deb --info "$deb"
            dpkg-deb --contents "$deb"
          done
          ldid -e build/ios-arm64/hook-tests
          lipo -info build/ios-arm64/hook-tests
      - uses: actions/upload-artifact@v4
        with:
          name: burrow-tests-${{ github.run_number }}
          path: build/packages/*.deb
          if-no-files-found: error
